[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "play-dm"
version = "0.1.0"
description = "DnD 5e DM tool — human DM, LLM players powered by Anthropic"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/play_dm"]
